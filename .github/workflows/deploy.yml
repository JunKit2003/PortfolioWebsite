name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_O2_SITE: ${{ vars.O2_SITE }}
          VITE_O2_ORG: ${{ vars.O2_ORG }}
          VITE_O2_CLIENT_TOKEN: ${{ secrets.O2_CLIENT_TOKEN }}
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Test activate-release script
        run: bash ../.github/scripts/test-activate-release.sh

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -p ${PORT} -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete -e "$SSH_CMD" dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/portfolio/releases/.${GITHUB_SHA}.partial/"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- /var/www/portfolio ${GITHUB_SHA} 5" < ../.github/scripts/activate-release.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
