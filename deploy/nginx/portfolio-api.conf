# Portfolio API proxy for the VM's nginx.
#
# Include this file INSIDE the existing `server { ... }` block for the site
# (the one serving /var/www/portfolio/current), e.g.:
#     include /etc/nginx/snippets/portfolio-api.conf;
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Real client IP: when the Cloudflare DNS record is proxied (orange cloud),
# requests arrive from Cloudflare addresses. nginx trusts only Cloudflare's
# published ranges and takes the visitor IP from CF-Connecting-IP. When the
# record is DNS-only (grey cloud), the header is ignored because the peer is
# not a Cloudflare address, so $remote_addr stays the real visitor.
#
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-11-19).
# Refresh them now and then; a stale list makes some visitors share a rate limit.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (do not append) so a client cannot inject a fake address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
}
